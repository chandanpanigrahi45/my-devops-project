name: Node.js CI-CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t nodejs-devops-app .

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          docker tag nodejs-devops-app ${{ secrets.DOCKER_USERNAME }}/nodejs-devops-app:latest
          docker tag nodejs-devops-app ${{ secrets.DOCKER_USERNAME }}/nodejs-devops-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/nodejs-devops-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/nodejs-devops-app:${{ github.sha }}